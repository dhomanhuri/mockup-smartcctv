server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This app has been bitten twice now by a fixed bug that "didn't take"
    # for a viewer whose browser kept serving an old cached .js/.html from
    # before the fix — nginx's stock defaults let browsers cache static
    # files heuristically with no explicit signal to revalidate. Every
    # deploy of this container should be visible immediately, not whenever
    # each viewer's browser cache happens to expire.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

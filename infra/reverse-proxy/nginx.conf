server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker's embedded DNS (127.0.0.11) is authoritative for service names
    # on this network. Plain `proxy_pass http://backend:8000;` resolves
    # `backend` ONCE, when the worker starts, and caches that IP for the
    # worker's lifetime — so recreating `backend` (a rebuild, `docker
    # compose up -d`, anything that gives it a new container/IP) leaves
    # every proxied request 502ing with "connect() failed... Connection
    # refused" against the stale IP until reverse-proxy is restarted too.
    # Putting the upstream host in a variable forces nginx to re-resolve it
    # (respecting this resolver's `valid` TTL) on every request instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend REST API
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime violation feed
    location /ws/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Keycloak's own admin console + Admin REST API are intentionally NOT
    # reachable through the public app port — they only come up on the
    # dedicated port (8081 -> keycloak container directly). This path only
    # needs to serve the OIDC endpoints (auth/token/logout/certs) that the
    # app's login flow uses.
    location /auth/admin/ {
        return 403;
    }

    # Keycloak (runs with --http-relative-path=/auth, so no prefix stripping)
    location /auth/ {
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Camera live view (HLS segments/playlists from MediaMTX)
    #
    # This location strips the /hls/ prefix before forwarding (MediaMTX
    # serves each path at its own root, e.g. /demo-gerbang/index.m3u8, not
    # /hls/demo-gerbang/index.m3u8). A plain `proxy_pass http://host/;`
    # does that stripping automatically — but NOT when the proxy_pass
    # target is a variable (needed for the dynamic-DNS fix above): nginx
    # documents that a variable in proxy_pass makes it pass the ORIGINAL,
    # unstripped URI through instead, which 404'd every stream here until
    # the `rewrite ... break` below did the stripping explicitly.
    location /hls/ {
        set $mediamtx_upstream mediamtx:8888;
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://$mediamtx_upstream;
        proxy_redirect / /hls/;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control no-cache always;
    }

    # Static dashboard
    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
    }
}
